[project]
name = "romakl"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
    "cattrs>=26.2.0",
    "cryptography>=50.0.1",
    "datasets>=4.8.5,<5",
    "jax>=0.11.0,<0.12",
    "jaxtyping>=0.2.36",
    "lalamo",
    "llama-cpp-python",
    "loguru>=0.7.3",
    "msgspec>=0.19,<1",
    "numpy>=2,<3",
    "tokenizers>=0.22,<0.24",
    "typer>=0.15.1,<0.26",
]

[dependency-groups]
cuda = ["jax[cuda]>=0.11.0,<0.12", "exllamav3==1.5.1", "torch==2.10.0"]
dev = ["pyrefly>=0.60.2", "pytest>=8", "ruff>=0.14"]

[project.scripts]
romakl = "romakl.main:app"

[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["romakl*"]

[tool.uv]
package = true

[tool.uv.sources]
lalamo = { git = "https://github.com/trymirai/lalamo", branch = "main" }
llama-cpp-python = { git = "https://github.com/abetlen/llama-cpp-python", branch = "main" }
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "EM101",
    "EM102",
    "F722",
    "PLC0415",
    "PLR2004",
    "S101",
    "S311",
    "T201",
    "TRY003",
]

[tool.pyrefly]
python-version = "3.12.0"
infer-with-first-use = false
python-interpreter-path = ".venv/bin/python"
project-includes = ["./"]
ignore-missing-imports = ["exllamav3.*", "lalamo.*", "torch.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
